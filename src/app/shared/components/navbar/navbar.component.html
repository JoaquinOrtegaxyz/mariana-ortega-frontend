<nav class="bg-[#680300] text-white px-8 py-4 fixed w-full top-0 z-50 shadow-lg grid grid-cols-3 items-center">

  <div class="flex justify-start pl-8">
    <a routerLink="/" class="flex items-center hover:scale-105 transition-transform duration-300 cursor-pointer">
      <img src="assets/logo3.png" alt="Logo Inmobiliaria" class="h-24 w-auto object-contain" onError="this.src='https://placeholder.co/150x50/white/680300?text=Logo+Inmobiliaria'">
    </a>
  </div>

  <div class="flex justify-center space-x-8 font-semibold tracking-wide text-lg">
    <a routerLink="/venta" class="px-6 py-2 rounded-xl hover:bg-white/10 transition-all duration-300 cursor-pointer">Venta</a>
    <a routerLink="/alquiler" class="px-6 py-2 rounded-xl hover:bg-white/10 transition-all duration-300 cursor-pointer">Alquiler</a>
    <a routerLink="/contacto" class="px-6 py-2 rounded-xl hover:bg-white/10 transition-all duration-300 cursor-pointer">Contacto</a>
  </div>

  <div class="flex justify-end items-center gap-6 pr-8">

    <div class="flex items-center gap-4 border-r border-white/20 pr-4">
      <a href="https://www.facebook.com/Inmobiliarianecochea/" target="_blank" class="hover:text-gray-300 transition-colors duration-200" title="Facebook">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/></svg>
      </a>
      <a href="https://www.instagram.com/inmobiliaria_necochea/" target="_blank" class="hover:text-gray-300 transition-colors duration-200" title="Instagram">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
      <a href="https://wa.me/5492262579622" target="_blank" class="hover:text-gray-300 transition-colors duration-200" title="WhatsApp">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397 0 11.966 0c3.178.001 6.165 1.24 8.413 3.494 2.25 2.253 3.487 5.244 3.485 8.423-.003 6.616-5.34 11.965-11.909 11.965-2.005-.001-3.973-.507-5.729-1.476L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.725 1.451 5.4 0 9.792-4.401 9.794-9.802.001-2.616-1.013-5.076-2.86-6.925C16.4 1.988 13.931 .969 11.965.969c-5.404 0-9.8 4.403-9.802 9.804-.001 1.935.539 3.473 1.45 4.945l-1.004 3.665 3.758-.988z"/></svg>
      </a>
    </div>

    @if (!authService.isLoggedIn()) {
      <a routerLink="/login" class="px-4 py-2 rounded-lg text-sm font-bold opacity-80 hover:opacity-100 hover:bg-white/10 transition-all duration-300 cursor-pointer">Ingresar</a>
    }
    @else {
      <div class="relative">

        <button (click)="toggleMenu()" class="px-5 py-2 rounded-lg text-sm font-extrabold bg-white text-[#680300] hover:bg-gray-100 shadow-md transition-all duration-300 cursor-pointer flex items-center gap-2">
          Mi Cuenta
          <svg class="w-4 h-4 transition-transform duration-300" [ngClass]="{'rotate-180': isMenuOpen}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        @if (isMenuOpen) {
          <div class="absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden z-50">

            <a routerLink="/admin" (click)="closeMenu()" class="block px-4 py-3.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-[#680300] transition-colors border-b border-gray-50 cursor-pointer">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                Ir al Panel
              </div>
            </a>

            <a routerLink="/perfil" (click)="closeMenu()" class="block px-4 py-3.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 hover:text-[#680300] transition-colors border-b border-gray-50 cursor-pointer">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Configuración
              </div>
            </a>

            <button (click)="logout()" class="w-full text-left px-4 py-3.5 text-sm font-bold text-red-600 hover:bg-red-50 transition-colors cursor-pointer">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Cerrar Sesión
              </div>
            </button>

          </div>
        }
      </div>
    }

  </div>

</nav>

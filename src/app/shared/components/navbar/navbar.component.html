<nav class="bg-[#680300] text-white fixed w-full top-0 z-50 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-24">

      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/" class="flex items-center hover:scale-105 transition-transform duration-300 cursor-pointer">
          <img src="assets/logo3.png" alt="Logo Inmobiliaria" class="h-20 w-auto object-contain" onError="this.src='https://placeholder.co/150x50/white/680300?text=Logo+Inmobiliaria'">
        </a>
      </div>

      <div class="hidden md:flex justify-center space-x-8 font-semibold tracking-wide text-lg flex-1">
        <a routerLink="/venta" class="px-4 py-2 rounded-xl hover:bg-white/10 transition-all duration-300 cursor-pointer">Venta</a>
        <a routerLink="/alquiler" class="px-4 py-2 rounded-xl hover:bg-white/10 transition-all duration-300 cursor-pointer">Alquiler</a>
        <a routerLink="/contacto" class="px-4 py-2 rounded-xl hover:bg-white/10 transition-all duration-300 cursor-pointer">Contacto</a>
      </div>

      <div class="hidden md:flex items-center gap-6">
        <div class="flex items-center gap-4 border-r border-white/20 pr-4">
          <a href="https://www.facebook.com/Inmobiliarianecochea/" target="_blank" class="hover:text-gray-300 transition-colors duration-200" title="Facebook">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/></svg>
          </a>
          <a href="https://www.instagram.com/inmobiliaria_necochea/" target="_blank" class="hover:text-gray-300 transition-colors duration-200" title="Instagram">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.20 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          </a>
          <a href="https://wa.me/{{whatsappNumber}}" target="_blank" class="hover:text-gray-300 transition-colors duration-200" title="WhatsApp">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397 0 11.966 0c3.178.001 6.165 1.24 8.413 3.494 2.25 2.253 3.487 5.244 3.485 8.423-.003 6.616-5.34 11.965-11.909 11.965-2.005-.001-3.973-.507-5.729-1.476L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.725 1.451 5.4 0 9.792-4.401 9.794-9.802.001-2.616-1.013-5.076-2.86-6.925C16.4 1.988 13.931 .969 11.965.969c-5.404 0-9.8 4.403-9.802 9.804-.001 1.935.539 3.473 1.45 4.945l-1.004 3.665 3.758-.988z"/></svg>
          </a>
        </div>

        @if (!authService.isLoggedIn()) {
          <a routerLink="/login" class="px-4 py-2 rounded-lg text-sm font-bold opacity-80 hover:opacity-100 hover:bg-white/10 transition-all duration-300 cursor-pointer">Ingresar</a>
        } @else {
          <div class="relative group">
            <button class="px-5 py-2 rounded-lg text-sm font-extrabold bg-white text-[#680300] hover:bg-gray-100 shadow-md transition-all duration-300 cursor-pointer flex items-center gap-2">
              Mi Cuenta
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <div class="absolute right-0 top-full pt-2 w-48 hidden group-hover:block z-50">
               <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-100">
                 <a routerLink="/admin" class="block px-4 py-3 text-gray-800 hover:bg-gray-50 font-bold">Panel de Control</a>
                 <a routerLink="/admin" [queryParams]="{tab: 'configuracion'}" class="block px-4 py-3 text-gray-800 hover:bg-gray-50 font-bold border-t border-gray-100">Configuración</a>
                 <button (click)="logout()" class="w-full text-left px-4 py-3 text-red-600 hover:bg-red-50 font-bold border-t border-gray-100">Cerrar Sesión</button>
               </div>
            </div>
          </div>
        }
      </div>

      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" class="text-white hover:text-gray-200 focus:outline-none p-2">
          <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  @if (isMenuOpen) {
    <div class="md:hidden bg-white text-gray-800 shadow-xl border-t border-gray-100 absolute w-full left-0 top-24">
      <div class="px-4 pt-4 pb-6 space-y-2 flex flex-col">
        <a routerLink="/venta" (click)="closeMenu()" class="block px-4 py-3 rounded-xl font-bold hover:bg-gray-50">Venta</a>
        <a routerLink="/alquiler" (click)="closeMenu()" class="block px-4 py-3 rounded-xl font-bold hover:bg-gray-50">Alquiler</a>
        <a routerLink="/contacto" (click)="closeMenu()" class="block px-4 py-3 rounded-xl font-bold hover:bg-gray-50">Contacto</a>

        <div class="border-t border-gray-100 pt-4 mt-2">
          @if (!authService.isLoggedIn()) {
            <a routerLink="/login" (click)="closeMenu()" class="block px-4 py-3 rounded-xl font-bold text-[#680300] bg-red-50 text-center">Iniciar Sesión</a>
          } @else {
            <a routerLink="/admin" (click)="closeMenu()" class="block px-4 py-3 rounded-xl font-bold text-[#680300] bg-red-50 text-center">Panel de Control</a>
            <button (click)="logout()" class="w-full text-center px-4 py-3 mt-2 rounded-xl font-bold text-red-600 hover:bg-red-50 border border-red-100">Cerrar Sesión</button>
          }
        </div>
      </div>
    </div>
  }
</nav>

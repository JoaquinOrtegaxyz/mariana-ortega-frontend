<div class="min-h-screen bg-zinc-50 flex flex-col items-center justify-start pt-12 relative overflow-hidden">

  <div class="absolute top-0 left-0 w-full h-[350px] bg-[#680300] rounded-b-[100%] shadow-inner z-0"></div>

  <div class="relative z-10 w-full max-w-md flex flex-col gap-8 px-4 mt-4">

    <div class="flex flex-col items-center">
      <a routerLink="/" class="hover:scale-105 transition-transform duration-300">
         <img src="assets/logo.png" alt="Logo Inmobiliaria" class="h-24 w-auto object-contain drop-shadow-xl brightness-0 invert" onError="this.style.display='none'">
      </a>
      <h2 class="mt-5 text-center text-3xl font-extrabold text-white tracking-tight drop-shadow-md">
        Acceso Staff
      </h2>
    </div>

    <div class="bg-white py-10 px-8 shadow-2xl rounded-3xl border border-gray-100">

      <div *ngIf="infoMessage" class="text-amber-700 bg-amber-50 p-3.5 rounded-xl text-sm text-center font-bold mb-6 border border-amber-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        {{ infoMessage }}
      </div>

      <div *ngIf="errorMessage" class="text-red-700 bg-red-50 p-3.5 rounded-xl text-sm text-center font-bold mb-6 border border-red-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Correo Electrónico</label>
          <div class="mt-1">
            <input id="email" type="email" formControlName="email" class="appearance-none block w-full px-4 py-3.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#680300] focus:border-[#680300] sm:text-sm transition-all" placeholder="admin@ortegainmo.com.ar">
          </div>
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-500 text-xs mt-2 font-medium flex items-center gap-1">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
            Ingresá un correo válido.
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
          <div class="mt-1">
            <input id="password" type="password" formControlName="password" class="appearance-none block w-full px-4 py-3.5 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#680300] focus:border-[#680300] sm:text-sm transition-all" placeholder="••••••••">
          </div>
           <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-2 font-medium flex items-center gap-1">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
            La contraseña es obligatoria.
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" [disabled]="isLoading" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-[#680300] hover:bg-[#8a0400] disabled:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#680300] transition-all hover:-translate-y-0.5">
            {{ isLoading ? 'Ingresando...' : 'Ingresar al panel' }}
          </button>
        </div>
      </form>

      <div class="mt-8 text-center border-t border-gray-100 pt-6">
        <a routerLink="/" class="text-sm font-semibold text-gray-500 hover:text-[#680300] transition-colors flex items-center justify-center gap-2">
          &larr; Volver a la página principal
        </a>
      </div>

    </div>
  </div>
</div>

<div class="relative w-full min-h-[650px] flex items-center justify-center bg-white overflow-hidden">

  <img src="assets/necochea.jpeg" alt="Panorámica de Necochea" class="absolute inset-0 w-full h-full object-cover z-0">

  <div class="absolute inset-0 bg-black/30 z-10"></div>

  <div class="absolute bottom-0 left-0 w-full h-48 bg-gradient-to-t from-white to-white/0 z-20 pointer-events-none"></div>

  <div class="relative z-30 max-w-7xl mx-auto px-4 w-full flex flex-col items-center">

    <h1 class="text-5xl md:text-6xl font-extrabold text-white mb-10 text-center tracking-tight drop-shadow-[0_4px_6px_rgba(0,0,0,0.8)]">
      Encontrá tu próximo hogar
    </h1>

    <div class="bg-white/95 backdrop-blur-sm p-7 rounded-3xl shadow-2xl border border-gray-100 w-full max-w-5xl flex flex-col md:flex-row gap-5 items-end">

      <div class="w-full md:w-1/4">
        <label class="block text-sm font-semibold text-gray-800 mb-2.5 pl-1">Operación</label>
        <select class="w-full bg-white border border-gray-300 text-gray-950 text-sm rounded-xl focus:ring-[#680300] focus:border-[#680300] block p-4 cursor-pointer outline-none shadow-sm transition-all">
          <option value="">Cualquiera</option>
          <option value="SALE">Comprar</option>
          <option value="RENT">Alquilar</option>
          <option value="TEMPORARY_RENT">Alquiler Temporal</option>
        </select>
      </div>

      <div class="w-full md:w-1/4">
        <label class="block text-sm font-semibold text-gray-800 mb-2.5 pl-1">Inmueble</label>
        <select class="w-full bg-white border border-gray-300 text-gray-950 text-sm rounded-xl focus:ring-[#680300] focus:border-[#680300] block p-4 cursor-pointer outline-none shadow-sm transition-all">
          <option value="">Todos</option>
          <option value="HOUSE">Casa</option>
          <option value="APARTMENT">Departamento</option>
          <option value="COMMERCIAL">Local</option>
          <option value="LAND">Terreno</option>
        </select>
      </div>

      <div class="w-full md:w-2/4">
        <label class="block text-sm font-semibold text-gray-800 mb-2.5 pl-1">Ubicación o Barrio</label>
        <input type="text" placeholder="Ej: Centro, Quequén, Villa del Deportista..." class="w-full bg-white border border-gray-300 text-gray-950 text-sm rounded-xl focus:ring-[#680300] focus:border-[#680300] block p-4 outline-none shadow-sm transition-all">
      </div>

      <div class="w-full md:w-auto flex justify-center">
        <button class="bg-[#680300] hover:bg-[#8a0400] text-white font-bold py-4 px-12 rounded-xl transition-all duration-300 w-full md:w-auto flex items-center justify-center gap-2.5 shadow-md hover:shadow-lg hover:-translate-y-0.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
          Buscar
        </button>
      </div>

    </div>
  </div>
</div>

<div class="bg-white h-[400px] w-full flex flex-col items-center justify-start pt-12">
    <p class="text-gray-400">Acá empezaría la grilla de propiedades...</p>
</div>

<div *ngIf="activeTab === 'nueva'" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b border-gray-200 pb-4">Detalles del Inmueble</h2>

        <div *ngIf="successMessage" class="text-green-700 bg-green-50 p-4 rounded-xl text-sm font-bold mb-6 border border-green-200 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          {{ successMessage }}
        </div>

        <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()" class="space-y-6">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Título de la Publicación</label>
              <input type="text" formControlName="title" placeholder="Ej: Chalet céntrico 3 ambientes" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Precio (U$S)</label>
              <input type="number" formControlName="price" placeholder="Ej: 120000" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Descripción de la Propiedad</label>
            <textarea formControlName="description" rows="4" placeholder="Detallá las comodidades, estado del inmueble, etc." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all resize-none"></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo de Inmueble</label>
              <select formControlName="propertyType" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all bg-white">
                <option value="">Seleccionar...</option>
                <option value="HOUSE">Casa</option>
                <option value="APARTMENT">Departamento</option>
                <option value="COMMERCIAL">Local Comercial</option>
                <option value="LAND">Terreno</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Operación</label>
              <select formControlName="operationType" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all bg-white">
                <option value="">Seleccionar...</option>
                <option value="SALE">Venta</option>
                <option value="RENT">Alquiler</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-gray-700 mb-2">Calle</label>
              <input type="text" formControlName="street" placeholder="Ej: Calle 62" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Altura</label>
              <input type="text" formControlName="streetNumber" placeholder="Ej: 1234" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Dormit. / Baños</label>
              <div class="flex gap-2">
                <input type="number" formControlName="bedrooms" placeholder="D" class="w-1/2 px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all text-center">
                <input type="number" formControlName="bathrooms" placeholder="B" class="w-1/2 px-4 py-3 border border-gray-300 rounded-xl focus:ring-[#680300] focus:border-[#680300] outline-none transition-all text-center">
              </div>
            </div>
          </div>

          <div class="pt-4 border-t border-gray-200 flex justify-end mt-8">
            <button type="submit" class="bg-[#680300] hover:bg-[#8a0400] text-white font-bold py-3.5 px-8 rounded-xl transition-all duration-300 shadow-md flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              Guardar Propiedad
            </button>
          </div>

        </form>
      </div>
